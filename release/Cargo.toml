[package]
name = "project-tree-utility"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
description = "A cross-platform CLI for safe project structure workflows"
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
repository = "https://github.com/tanvirfoysal99/project-tree-utility"

[[bin]]
name = "ptu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
ctrlc = "3.4"
directories = "6"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
url = "2"
tempfile = "3"
yaml-rust2 = "0.10"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
